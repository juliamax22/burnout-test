.q-hint { font-size: 13px; opacity: .7; }

.ans { position: relative; font: 500 17px Inter; text-align: left; border: none; cursor: pointer; padding: 14px 16px; border-radius: 12px; background: transparent; color: var(--milk); transition: background .25s, color .25s; }

.battery .fill { width: 0; transition: width 1.6s cubic-bezier(.2,.8,.2,1) .25s; }
.pct { font-weight: 800; font-size: 40px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }

.foot { font-size: 11px; line-height: 1.5; opacity: .6; margin-top: 22px; }
.mood { border: 2px solid var(--terra); }
.reveal { opacity: 0; transform: translateY(14px); transition: opacity .6s, transform .6s cubic-bezier(.2,.8,.2,1); }
.reveal.in { opacity: 1; transform: none; }

};
// типографика: предлоги, союзы и частицы не висят в конце строки, «(-ым)» и «(сам)» не отрываются от слова
const SHORT = /(^|[\s («„"—–])([а-яё]{1,2}|без|для|под|над|при|про|обо|изо|или) /gi;
function nb(t) {
  let prev;
  do { prev = t; t = t.replace(SHORT, '$1$2 '); } while (t !== prev);
  return t.replace(/(\d) /g, '$1 ')
    .replace(/ (ли|же|бы|—|-)(?=[\s,.!?])/g, ' $1')
    .replace(/\(-|([а-яё])-(?=[а-яё])/gi, (m, a) => a ? a + '‑' : '(‑')
    .replace(/ \((сам|самому)\)/g, ' ($1)');
}
function typo(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; (n = w.nextNode());) { const t = nb(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; }
}
const doodle = side => `<div class="doodle"><span class="float">${DOODLE[side]}</span><span class="deco float" style="left:18%;top:18%;animation-delay:-1s">${sparkle('#F2B18C', 16)}</span><span class="deco float" style="right:16%;bottom:16%;animation-delay:-2.5s">${sparkle('#8C2A0E', 14)}</span></div>`;

const state = { a: Array(BAT.length + PHQ.length).fill(null), free: new Set() };
const app = document.getElementById('app');

function topBar(n) {

}
function build() {

    <div class="notif" style="margin-top:16px"><div class="ic">${battery('#FAF5EE', '#FAF5EE', 24, 12)}</div><div><small>Батарея · сейчас</small><p>Осталось 12% заряда. Подключите зарядку.</p></div></div>
    <div class="illu-wrap" style="margin-top:14px"><div class="win"><div class="win-h"><b></b><b></b><b></b><span>сейчас.png</span></div><div class="pic">${img('иллюстрации/вступление.webp', 'Уставшая девушка за ноутбуком, рядом значок разряженной батарейки', LAPTOP)}</div></div>
      <span class="deco float" style="right:-6px;top:30px">${sparkle('#8C2A0E', 24)}</span><span class="deco float" style="left:-8px;bottom:18px;animation-delay:-2s">${sparkle('#F2B18C', 18)}</span></div>

    ${i === 0 ? '<p class="small" style="margin-top:12px">Если вы фрилансер, «на работе» - это когда вы работаете, даже если ваш офис это диван.</p>' : ''}

  PHQ.forEach((t, j) => v.push(`<div class="view q" data-q="${BAT.length + j}">${topBar(BAT.length + j + 1)}
    <div class="win" style="margin-top:20px"><div class="win-h"><b></b><b></b><b></b><span>Настроение</span></div><div class="win-b">${j === 0 ? '<p class="small" style="margin-bottom:8px;opacity:.8">Два последних вопроса не про работу, а про ваше настроение в целом.</p>' : ''}<div class="q-hint">Как часто за последние 2 недели вы так себя чувствовали?</div><div class="q-text">${t}</div></div></div>
    ${doodle('Настроение')}

let cur = 0;
function views() { return [...app.querySelectorAll('.view:not(.result)')]; }
function show(n, back) {
  const vs = views();

}
function wire() {
  const vs = views();
  vs.forEach((vw, i) => {
    vw.querySelectorAll('.go').forEach(b => b.onclick = () => i === vs.length - 1 ? result() : show(i + 1));

    vw.querySelectorAll('.check').forEach(c => {
      const t = () => { c.classList.toggle('on'); c.setAttribute('aria-checked', c.classList.contains('on')); c.classList.contains('on') ? state.free.add(+c.dataset.k) : state.free.delete(+c.dataset.k); };
      c.onclick = t; c.onkeydown = e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); t(); } };
    });

}

function calc() {
  const bat = state.a.slice(0, BAT.length);
  const sum = bat.reduce((s, x) => s + x, 0);
  const avg = sum / BAT.length;
  const level = avg < 2.54 ? 0 : avg < 2.96 ? 1 : 2;
  // заряд привязан к уровням: зелёный 100-60 %, оранжевый 59-30 %, красный 29-3 %
  const lerp = (x, a, b, p, q) => p + (q - p) * (x - a) / (b - a);
  const pct = Math.round(avg < 2.54 ? lerp(avg, 1, 2.54, 100, 60) : avg < 2.96 ? lerp(avg, 2.54, 2.96, 59, 30) : lerp(Math.min(avg, 5), 2.96, 5, 29, 3));
  const sides = Object.keys(SIDES).map((name, k) => [name, (bat[k * 3] + bat[k * 3 + 1] + bat[k * 3 + 2]) / 3]);
  const topSide = sides.reduce((m, s) => s[1] > m[1] ? s : m, sides[0]);
  const phq = state.a[BAT.length] + state.a[BAT.length + 1];
  return { sum, avg, level, pct, sides, topSide, phq, free: state.free.size };
}
const f1 = x => x.toFixed(1).replace('.', ',');
const f2 = x => x.toFixed(2).replace('.', ',');

function result() {
  const r = calc(), L = LEVELS[r.level];
  const sides = r.sides.map(([n, s]) => `<div class="side ${n === r.topSide[0] ? 'top1' : ''}"><div class="t"><span>${n}</span><span>${f1(s)}</span></div><div class="track"><i data-w="${Math.round((s - 1) / 4 * 100)}"></i></div></div>`).join('');

    ${r.phq >= 3 ? `<div class="card mood reveal"><h3>Стоит поговорить со специалистом</h3><p class="res-text" style="font-size:14px">Ваши ответы про настроение говорят о том, что последние две недели вам по-настоящему тяжело. Это не диагноз, это повод показаться психологу или психотерапевту, потому что за таким состоянием может стоять не только выгорание, но и депрессия, а её лечат.</p></div>` : ''}

    ${r.free ? `<div class="card reveal" style="background:var(--peach)"><h3>Вы отметили ${r.free} из 6</h3><p class="res-text" style="font-size:14px;margin-top:6px">Мне знакомы все шесть, и про это моя история ниже.</p></div>` : ''}
    <div class="card reveal"><div class="me"><div class="ava">Ю</div><div><h3>Где я сейчас</h3><p class="small" style="opacity:.7;margin-top:2px">Юля, @yu.mova.ai</p></div></div><p class="res-text" style="font-size:14.5px">${ME}</p>
      <a class="btn dark" href="${TG}" target="_blank" rel="noopener" style="margin-top:14px">Читать в Telegram</a></div>

    <p class="foot">Это самопроверка, а не диагноз. В тесте использованы опросники Burnout Assessment Tool (BAT-12) - Schaufeli, De Witte, Desart (KU Leuven), Hadžibajramović и др., 2022 - и PHQ-2 (Kroenke и др., 2003). Перевод на русский наш. Пороги BAT предварительные и получены на работниках Нидерландов, Бельгии и Финляндии. Ответы никуда не отправляются.</p>`;
  app.classList.add('on-result');

    const cnt = el.querySelector('.cnt'), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 1600); cnt.textContent = Math.round(r.pct * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);

  el.querySelectorAll('.reveal:not(.in)').forEach((x, k) => setTimeout(() => {
    x.classList.add('in');
    x.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
  }, 900 + k * 220));
  el.querySelector('.again').onclick = () => { state.a.fill(null); state.free.clear(); app.classList.remove('on-result'); cur = 0; build(); window.scrollTo({ top: 0 }); };
  el.querySelector('.save').onclick = () => saveCard(r, L);
}

async function saveCard(r, L) {
  await document.fonts.ready;
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#FAF5EE'; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(47,26,21,.07)'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = 'rgba(47,26,21,.6)'; g.font = '600 26px Inter'; g.textBaseline = 'top';
  g.fillText('ТЕСТ НА ВЫГОРАНИЕ', 96, 262); const hand = '@yu.mova.ai'; g.fillText(hand.toUpperCase(), W - 96 - g.measureText(hand.toUpperCase()).width, 262);
  const rr = (x, y, w, h, rad) => { g.beginPath(); g.roundRect(x, y, w, h, rad); };

  g.fillStyle = '#fff'; g.shadowColor = 'rgba(47,26,21,.12)'; g.shadowBlur = 50; g.shadowOffsetY = 18; rr(X, Y, WW, WH, 44); g.fill(); g.shadowColor = 'transparent';
  g.fillStyle = '#F4F1EE'; rr(X, Y, WW, 76, [44, 44, 0, 0]); g.fill();
  ['#8C2A0E', 'rgba(47,26,21,.2)', 'rgba(47,26,21,.2)'].forEach((col, k) => { g.fillStyle = col; g.beginPath(); g.arc(X + 44 + k * 30, Y + 38, 10, 0, 7); g.fill(); });
  g.fillStyle = 'rgba(47,26,21,.7)'; g.font = '600 24px Inter'; g.fillText('БАТАРЕЯ', X + 144, Y + 25);
  const by = Y + 108;
  g.strokeStyle = '#2F1A15'; g.lineWidth = 12; rr(X + 50, by, 280, 130, 26); g.stroke(); g.fillStyle = '#2F1A15'; rr(X + 338, by + 40, 18, 50, 7); g.fill();
  g.fillStyle = L.fill; rr(X + 70, by + 20, Math.max(14, 240 * r.pct / 100), 90, 12); g.fill();
  g.fillStyle = '#2F1A15'; g.font = '800 120px Inter'; g.fillText(r.pct + '%', X + 400, by - 6);
  g.font = '500 30px Inter'; g.globalAlpha = .7; g.fillText(`${r.sum} из 60 · средний ${f2(r.avg)}`, X + 404, by + 112); g.globalAlpha = 1;
  try {
    const im = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = L.img; });
    const top = Y + 270;
    g.save(); rr(X, top, WW, WH - 270, [0, 0, 44, 44]); g.clip();
    g.fillStyle = "#FAF5EE"; g.fillRect(X, top, WW, WH - 270);
    g.drawImage(im, X + (WW - IMG) / 2, top + 4, IMG, IMG); g.restore();
  } catch (e) {}
  g.fillStyle = '#2F1A15'; g.font = '800 88px Inter'; let y = Y + WH + 54;
  const tl = wrap(g, nb(L.title), X, y, WW); tl.forEach((ln, k) => g.fillText(ln, X, y + k * 96)); y += tl.length * 96 + 20;
  g.font = '500 42px Inter'; g.fillStyle = '#8C2A0E'; g.fillText(L.name, X, y); y += 64;
  g.fillStyle = '#2F1A15'; g.font = '400 34px Inter'; g.fillText('Сильнее всего: ' + r.topSide[0].toLowerCase(), X, y);
  g.fillStyle = '#8C2A0E'; rr(X, H - 360, WW, 108, 54); g.fill();
  g.fillStyle = '#FAF5EE'; g.font = '600 40px Inter'; const cta = 'Пройти тест - ссылка в профиле'; g.fillText(cta, (W - g.measureText(cta).width) / 2, H - 326);
  let blob;
  try { blob = await new Promise(ok => c.toBlob(ok, 'image/png')); } catch (e) { blob = null; }
  if (!blob) { alert('Не получилось сохранить картинку. Сделайте скриншот экрана результата.'); return; }
  (b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'мой-результат-выгорание.png';
    const file = new File([b], 'мой-результат-выгорание.png', { type: 'image/png' });
    const phone = matchMedia('(pointer: coarse)').matches;
    if (phone && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); })(blob);
}
// цвет фона картинки (левый верхний угол), чтобы подложка совпадала без шва
function cornerColor(im) {
  try { const c = document.createElement('canvas'); c.width = c.height = 1; const x = c.getContext('2d'); x.drawImage(im, 4, 4, 1, 1, 0, 0, 1, 1); const [r, g, b] = x.getImageData(0, 0, 1, 1).data; return `rgb(${r},${g},${b})`; } catch (e) { return '#FAF5EE'; }
}
function wrap(g, text, x, y, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}

build();
